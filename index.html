<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sanjana Rane — Marketing Operations & Digital Campaigns</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>

<style>
  @font-face {
    font-family: 'TT Norms Pro';
    src: url('/fonts/tt-norms-pro-regular.woff2') format('woff2');
    font-weight: 400; font-display: swap;
  }
  @font-face {
    font-family: 'TT Norms Pro';
    src: url('/fonts/tt-norms-pro-semibold.woff2') format('woff2');
    font-weight: 600; font-display: swap;
  }

  :root {
    --page-bg: #F1F5FB;
    --card-dark: #14233A;
    --pill-bg: #2F6BFF;
    --accent: #2F6BFF;
  }

  html, body { background: var(--page-bg); }
  html, body, * {
    font-family: 'TT Norms Pro', 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  body { margin: 0; color: #111; -webkit-font-smoothing: antialiased; }
  #root { background: var(--page-bg); }
  a { text-decoration: none; }

  /* palette-driven utilities */
  .bg-page { background: var(--page-bg); }
  .bg-card-dark { background: var(--card-dark); }
  .accent-text { color: var(--accent); }
  .btn-pill { background: var(--pill-bg); color: #fff; }
  .btn-pill:hover { filter: brightness(0.88); }

  /* legibility scrim: keeps dark text readable over the video on the text side */
  .hero-scrim {
    background: linear-gradient(100deg,
      rgba(255,255,255,0.94) 0%,
      rgba(255,255,255,0.86) 32%,
      rgba(255,255,255,0.45) 58%,
      rgba(255,255,255,0) 82%);
  }

  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee-track { display: flex; width: max-content; animation: marquee 22s linear infinite; }

  @keyframes backers-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .backers-track { display: flex; width: max-content; animation: backers-marquee 30s linear infinite; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--page-bg); }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react" src="tweaks-panel.jsx"></script>
<script type="text/babel" data-presets="react" src="halo-portfolio-core.jsx"></script>
<script type="text/babel" data-presets="react" src="halo-portfolio-app.jsx"></script>
</body>
</html>
